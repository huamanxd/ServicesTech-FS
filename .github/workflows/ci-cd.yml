name: ServicesTech - CI / GitHub Packages / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend - JDK 21 y pruebas Gradle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: servicestech
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: servicestech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicestech -d servicestech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/servicestech
      DB_USER: servicestech
      DB_PASSWORD: ci_password_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y probar Spring Boot
        working-directory: ServicesBackend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test

  frontend-test:
    name: Frontend - Node 22 y pruebas React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar y verificar frontend
        working-directory: ServicesFrontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

  docker-smoke:
    name: Integración - Docker Compose y roles
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno aislado de CI
        run: |
          cp .env.example .env
          # Sobrescribe las claves publicas de desarrollo en CI.
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_password_only/' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci_admin_password_2026/' .env
      - name: Compilar e iniciar los 3 contenedores
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Comprobar catálogo, admin, cliente y rutas React
        env:
          ADMIN_EMAIL: admin@admin.com
          ADMIN_PASSWORD: ci_admin_password_2026
        run: python3 scripts/smoke-ci.py
      - name: Diagnóstico si falla
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail 150
      - name: Limpiar recursos efímeros de CI
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: GHCR - ${{ matrix.part }}
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: backend
            context: ./ServicesBackend
          - part: frontend
            context: ./ServicesFrontend
    steps:
      - uses: actions/checkout@v4
      - name: Nombre válido para GHCR (minúsculas)
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.names.outputs.owner }}/servicestech-${{ matrix.part }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ServicesTech ${{ matrix.part }} Java Spring Boot / React
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag
      - name: Construir y publicar paquete Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=servicestech-${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=servicestech-${{ matrix.part }}

  deploy:
    name: CD - actualizar VPS por SSH
    runs-on: ubuntu-latest
    needs: [publish]
    # Solo si el dueño habilita DEPLOY_ENABLED=true y configura los secretos de despliegue.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: production-servicestech
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar imágenes desde GHCR al servidor
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configura DEPLOY_HOST}"
          : "${DEPLOY_USER:?Configura DEPLOY_USER}"
          : "${DEPLOY_PATH:?Configura DEPLOY_PATH}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Configura DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Configura DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]] || { echo 'DEPLOY_PATH debe ser una ruta absoluta sin espacios'; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          "${SCP[@]}" compose.deploy.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.deploy.yml"
          # .env pertenece al servidor y NUNCA se reemplaza desde GitHub Actions.
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && test -f .env && git pull --ff-only origin main && sudo -n docker compose build backend && sudo -n docker compose build frontend && sudo -n docker compose up -d --no-build --wait && sudo -n docker compose ps"


