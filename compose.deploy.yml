# CD: descarga imagenes precompiladas de GHCR, sin compilar en el servidor.
name: servicestech
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicestech}
      POSTGRES_USER: ${DB_USER:-servicestech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env del servidor}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    image: ghcr.io/${GHCR_OWNER:?Define GHCR_OWNER en .env}/servicestech-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-servicestech}
      DB_USER: ${DB_USER:-servicestech}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env del servidor}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env del servidor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env del servidor}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      PORT: '8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 50s

  frontend:
    image: ghcr.io/${GHCR_OWNER:?Define GHCR_OWNER en .env}/servicestech-frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  datos_postgres:
