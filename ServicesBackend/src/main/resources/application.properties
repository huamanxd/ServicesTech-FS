spring.application.name=servicesbackend
server.port=${PORT:8080}
# Render/Vercel/Nginx actúan como proxy: respeta X-Forwarded-*
server.forward-headers-strategy=framework

# Base de datos. En Render se puede usar DATABASE_URL (postgres://...): ver UrlBaseDatos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicestech}
spring.datasource.username=${DB_USER:servicestech}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway es el único que crea o modifica tablas; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.horas=${APP_JWT_HOURS:8}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# FRONTEND_ORIGINS (o FRONTEND_ORIGIN, nombre usado en versiones anteriores): orígenes permitidos por CORS
app.frontend-origins=${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}}

# Salud para Docker/Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Documentación OpenAPI / Swagger UI
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
