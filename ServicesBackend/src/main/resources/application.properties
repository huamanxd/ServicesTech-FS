spring.application.name=servicesbackend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicestech}
spring.datasource.username=${DB_USER:servicestech}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.frontend-origins=${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.jwt.secret=${APP_JWT_SECRET:}
