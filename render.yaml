# Blueprint de Render: backend Spring Boot (Docker) + PostgreSQL.
# El frontend se despliega en Vercel (ServicesFrontend/vercel.json reenvía /api a este servicio).
# Uso: Render > New > Blueprint > selecciona este repositorio.
# Si el servicio ya existe (creado a mano), copia estas variables en su pestaña Environment.
services:
  - type: web
    name: servicestech-fs            # define la URL https://servicestech-fs.onrender.com usada en vercel.json
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./ServicesBackend
    dockerfilePath: ./ServicesBackend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass    # despliega solo si el workflow de GitHub Actions pasó
    envVars:
      - key: DATABASE_URL            # postgres://... ; la app la traduce a JDBC (UrlBaseDatos)
        fromDatabase:
          name: servicestech-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true          # Base64 de 256 bits generado por Render
      - key: ADMIN_EMAIL
        sync: false                  # se pide al crear el Blueprint
      - key: ADMIN_PASSWORD
        sync: false                  # mínimo 12 caracteres; NO uses la clave de demostración
      - key: FRONTEND_ORIGINS
        sync: false                  # ej.: https://servicestech.vercel.app
      - key: DB_POOL_SIZE
        value: "3"

databases:
  - name: servicestech-db
    plan: free                       # la base gratuita de Render vence a los 30 días
    region: oregon
    databaseName: servicestech
    user: servicestech
    postgresMajorVersion: "17"
